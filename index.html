          { name: "忠犬八公像 / ハチ公像 / Hachiko", lat: 35.659057, lng: 139.700472, type: "spot", time: "14:00", desc: "涩谷城市段入口，作为柯南半日的现实街景开场。", status: "坐标已核实", photo: "不必排队硬合影，可拍人潮与车站出口的城市感。" },
          { name: "涩谷十字路口 / 渋谷スクランブル交差点", lat: 35.6595, lng: 139.7005, type: "spot", time: "14:30", desc: "《万圣节的新娘》的涩谷城市氛围参考点；只拍城市，不做动漫店巡礼。", status: "柯南半日 · 城市拍照", photo: "过街时拍动态，站在人行道等候区拍广角；注意行人安全。" },
          { name: "SHIBUYA SKY / 渋谷スカイ", lat: 35.65845, lng: 139.70205, type: "spot", time: "16:30", desc: "建议预约日落前入场；屋顶开放受天气影响，大件行李和屋顶携带物有限制。", status: "票务/天气/携带规则需确认", photo: "日落前拍城市全景，蓝调时刻拍涩谷灯光；深色外套轮廓最清楚。" },
          { name: "涩谷 PARCO / 渋谷PARCO", lat: 35.66202, lng: 139.69965, type: "spot", time: "—", desc: "仅作为顺路备选；若2026年有柯南官方活动再加入，不得虚构。", status: "2026年柯南活动尚未公布", photo: "如经过，拍现代建筑和街区夜色即可。" }
        ] },
        { id: 6, label: "10/8 转场", color: "#b79267", date: "2026年10月8日", title: "东京弹性早晨 · 京都转场", theme: "行李日，不塞满", routeLogic: "根据新干线时间选择东京站/丸之内咖啡或银座短走；不再新增完整购物日。", outfit: "柔软针织、直筒长裤、舒适球鞋、轻外套、便于取物的 tote 或斜挎包。", locations: [
          { name: "东京站 / 東京駅 / Tokyo Station", lat: 35.681236, lng: 139.767125, type: "transport", time: "上午", desc: "寄存/取行李、新干线出发；具体车次未提供。", status: "新干线时间待补充", photo: "站房外观或月台秩序感，拍一张干净的转场照。" },
          { name: "银座四丁目交差点 / Ginza 4-chome Crossing", lat: 35.67192, lng: 139.76503, type: "spot", time: "—", desc: "若下午才去京都，可选银座短走和最后补货；控制在90分钟内。", status: "可选 · 不做第二个购物日", photo: "Wako 钟楼与路口人流，50mm 拍都市优雅感。" }
        ] }
      ]
    };

    const map = L.map("map", { zoomControl: false, attributionControl: true }).setView([35.681236, 139.767125], 11);
    L.control.zoom({ position: "topright" }).addTo(map);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", { maxZoom: 19 }).addTo(map);

    const tabsEl = document.getElementById("tabs");
    const contentEl = document.getElementById("content");
    let current = 0;
    let layers = [];

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[ch]));
    }
    function googleUrl(loc) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${loc.lat},${loc.lng}`)}`;
    }
    function appleUrl(loc) {
      return `https://maps.apple.com/?ll=${loc.lat},${loc.lng}&q=${encodeURIComponent(loc.name)}`;
    }
    function iconFor(loc, color) {
      const glyph = loc.type === "food" ? "餐" : loc.type === "drink" ? "酒" : loc.type === "transport" ? "站" : "景";
      return L.divIcon({
        className: "",
        html: `<div style="width:28px;height:28px;border-radius:50%;background:${color};color:#fffaf2;border:2px solid #fffaf2;display:flex;align-items:center;justify-content:center;font:800 11px system-ui;box-shadow:0 8px 18px rgba(0,0,0,.24)">${glyph}</div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -15]
      });
    }
    function clearLayers() {
      layers.forEach(layer => map.removeLayer(layer));
      layers = [];
    }
    function dayById(id) {
      return TRIP.days.find(day => day.id === id);
    }
    function showMap(id) {
      clearLayers();
      const bounds = [];
      if (id === 0) {
        TRIP.days.slice(1).forEach(day => day.locations.forEach(loc => {
          const marker = L.circleMarker([loc.lat, loc.lng], { radius: 4.5, color: "#fffaf2", weight: 1.5, fillColor: day.color, fillOpacity: .94 })
            .addTo(map)
            .bindPopup(`<strong>${esc(loc.name)}</strong><br>${esc(day.label)}`);
          layers.push(marker);
          bounds.push([loc.lat, loc.lng]);
        }));
      } else {
        const day = dayById(id);
        const route = day.locations.filter(loc => loc.time !== "—");
        day.locations.forEach(loc => {
          const marker = L.marker([loc.lat, loc.lng], { icon: iconFor(loc, day.color) })
            .addTo(map)
            .bindPopup(`<strong>${esc(loc.name)}</strong><br>${esc(loc.time)} · ${esc(loc.status)}<br><a href="${googleUrl(loc)}" target="_blank" rel="noreferrer">Google Maps</a> · <a href="${appleUrl(loc)}" target="_blank" rel="noreferrer">Apple Maps</a>`);
          layers.push(marker);
          bounds.push([loc.lat, loc.lng]);
        });
        if (route.length > 1) {
          const line = L.polyline(route.map(loc => [loc.lat, loc.lng]), { color: day.color, weight: 3, opacity: .58, dashArray: "7 7" }).addTo(map);
          layers.push(line);
        }
      }
      if (bounds.length) map.fitBounds(bounds, { padding: [28, 28], maxZoom: id === 0 ? 9 : 14 });
    }
    function overview() {
      return `
        <section class="panel">
          <p class="kicker">Route Check</p>
          <h2>先优化路线，再做地图</h2>
          <p class="muted">10/4 按浅草 → 丸之内 → 东京塔顺走；10/5 富士与10/6镰仓组成天气互换组；10/7 柯南只保留半天以内的涩谷城市拍照，不展开动漫购物巡礼。</p>
          <div class="grid mini">
            <div><div class="label">酒店</div><div class="value">未提供，第一晚需补充后改为酒店附近</div></div>
            <div><div class="label">视觉</div><div class="value">暖奶油、黑、灰、低饱和蓝</div></div>
            <div><div class="label">重点</div><div class="value">东京初体验、富士、镰仓、涩谷、购物一次</div></div>
            <div><div class="label">诚信</div><div class="value">未来活动/价格/开放时间不虚构</div></div>
          </div>
        </section>
        <section class="panel alert">
          <p class="kicker">Weather Logic</p>
          <h3>富士山日必须动态决策</h3>
          <p class="muted">出发前48-72小时比较 10月5日 与 10月6日 的云量、降雨、风和富士能见度。若 10月6日 更清晰，就把富士和镰仓对调。</p>
        </section>
        <section class="panel alert blue">
          <p class="kicker">Reservation</p>
          <h3>东京塔景观酒吧：待核实</h3>
          <p class="muted">候选为 Sky Bar & Dining Stellar Garden。当前官方信息显示其位于 The Prince Park Tower Tokyo 33F，并提供东京塔景观和预约入口；但 2026年10月的营业、座位、低消、着装和摄影政策仍需发布前确认。</p>
        </section>
        <div class="section-title">每日入口</div>
        ${TRIP.days.slice(1).map(day => `<button class="panel" style="width:100%;text-align:left;border-color:${day.color}" onclick="go(${day.id})"><p class="kicker">${esc(day.label)}</p><h3>${esc(day.title)}</h3><p class="muted">${esc(day.theme)}</p></button>`).join("")}
      `;
    }
    function card(loc, day) {
      const warn = /待核实|天气|确认|公布|补充/.test(loc.status) ? " warn" : "";
      return `
        <article class="card ${esc(loc.type)}">
          <div class="time">${esc(loc.time)}</div>
          <div class="name">${esc(loc.name)}</div>
          <p class="desc">${esc(loc.desc)}</p>
          <span class="status${warn}">${esc(loc.status)}</span>
          <details open>
            <summary>拍照时间与构图</summary>
            <p class="photo-note">${esc(loc.photo)}</p>
          </details>
          <div class="actions">
            <a class="btn" target="_blank" rel="noreferrer" href="${googleUrl(loc)}">Google Maps</a>
            <a class="btn secondary" target="_blank" rel="noreferrer" href="${appleUrl(loc)}">Apple Maps</a>
          </div>
        </article>`;
    }
    function renderDay(id) {
      const day = dayById(id);
      const main = day.locations.filter(loc => loc.time !== "—");
      const alt = day.locations.filter(loc => loc.time === "—");
      return `
        <section class="day-head">
          <div class="date">${esc(day.date)}</div>
          <h2>${esc(day.title)}</h2>
          <p class="muted">${esc(day.theme)}</p>
        </section>
        <section class="panel"><p class="kicker">Route Logic</p><p class="route"><strong>路线判断：</strong>${esc(day.routeLogic)}</p>${day.swapRule ? `<p class="route mini"><strong>互换逻辑：</strong>${esc(day.swapRule)}</p>` : ""}<p class="route mini"><strong>穿搭：</strong>${esc(day.outfit)}</p></section>
        <div class="section-title">行程</div>
        <section class="timeline">${main.map(loc => card(loc, day)).join("")}</section>
        ${alt.length ? `<div class="section-title">备选</div><section class="timeline">${alt.map(loc => card(loc, day)).join("")}</section>` : ""}
      `;
    }
    function go(id) {
      current = id;
      [...tabsEl.children].forEach(btn => btn.classList.toggle("active", Number(btn.dataset.id) === id));
      contentEl.innerHTML = id === 0 ? overview() : renderDay(id);
      showMap(id);
      window.scrollTo({ top: document.querySelector(".map-wrap").offsetTop, behavior: "smooth" });
      const active = tabsEl.querySelector(`[data-id="${id}"]`);
      if (active) active.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
    }
    TRIP.days.forEach(day => {
      const btn = document.createElement("button");
      btn.className = "tab";
      btn.dataset.id = day.id;
      btn.type = "button";
      btn.textContent = day.label;
      btn.addEventListener("click", () => go(day.id));
      tabsEl.appendChild(btn);
    });
    go(current);
  </script>
</body>
</html>
